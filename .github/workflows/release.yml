# On a version tag: build the artifacts with `npm run release` (the same script a developer
# runs locally), push the multi-arch image, and publish a release with the notes rendered
# from release-template.md. Shell steps where possible; buildx/login/release use actions
# because they are the platform's own plumbing.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  RELEASE_IMAGE: ghcr.io/${{ github.repository_owner }}/faktura

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node 22 and Bun
        run: |
          curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
          sudo apt-get install -y nodejs
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix mcp ci

      - name: Build release artifacts (installers, three binaries, SHA256SUMS, release notes)
        run: npm run release

      - name: Log in to the container registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up QEMU and buildx for arm64
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push the multi-arch image
        run: |
          VERSION="$(cat dist/VERSION)"
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t "$RELEASE_IMAGE:$VERSION" -t "$RELEASE_IMAGE:latest" --push .

      - name: Create the release with all artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(cat dist/VERSION)"
          gh release create "${{ github.ref_name }}" \
            --title "Faktura $VERSION" \
            --notes-file dist/RELEASE_NOTES.md \
            dist/install.sh dist/install.ps1 dist/faktura-* dist/SHA256SUMS
